[pytest]
asyncio_mode = auto
# One loop for the whole session so the async SQLAlchemy/asyncpg pool
# is not re-bound across function-scoped loops (avoids "different loop" errors).
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
testpaths = tests
pythonpath = .
markers =
    eval: live AI quality evals — excluded from default CI runs
    integration: HTTP + DB integration tests
addopts = -m "not eval"
filterwarnings =
    ignore::DeprecationWarning
