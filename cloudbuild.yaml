# Vercel deploys client/ directly from GitHub — no Cloud Build step required for the frontend.

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_ARTIFACT_REGISTRY}/nouri-api:${SHORT_SHA}
      - -f
      - api/Dockerfile.api
      - api/
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_ARTIFACT_REGISTRY}/nouri-api:${SHORT_SHA}

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - ${_ARTIFACT_REGISTRY}/nouri-worker:${SHORT_SHA}
      - -f
      - api/Dockerfile.worker
      - api/
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_ARTIFACT_REGISTRY}/nouri-worker:${SHORT_SHA}

images:
  - ${_ARTIFACT_REGISTRY}/nouri-api:${SHORT_SHA}
  - ${_ARTIFACT_REGISTRY}/nouri-worker:${SHORT_SHA}
